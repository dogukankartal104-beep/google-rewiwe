<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanal Üye Aktarıcı</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#2563eb;--bd:#e4e7ec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#e8ecf1;--mut:#8b95a5;--ac:#5b8def;--bd:#262d38}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px}h1{font-size:22px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin:16px 0}
h2{font-size:16px;margin:0 0 10px}p{color:var(--mut);margin:4px 0 10px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:13px}
button,a.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--bd)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:13px;max-height:280px;overflow:auto;margin:10px 0 0}
.err{color:#d92d20}.hide{display:none}
</style></head><body><main>
<h1>Kanal Üye Aktarıcı</h1>
<p>Yalnızca yönetici olduğun kanallar. Telefon numarası alınmaz.</p>
<div id="msg" class="err"></div>

<div class="card hide" id="s-config"><h2>1. API bilgileri</h2>
<p><b>my.telegram.org</b> → API development tools adresinden ücretsiz alırsın.</p>
<input id="api_id" placeholder="API ID"><input id="api_hash" placeholder="API Hash">
<button onclick="saveCfg()">Kaydet</button></div>

<div class="card hide" id="s-login"><h2>2. Telegram girişi</h2>
<p>Kanallarda yönetici olan hesabınla giriş yap.</p>
<input id="phone" placeholder="+905xxxxxxxxx"><button onclick="sendCode()">Kod gönder</button>
<div id="codebox" class="hide"><input id="code" placeholder="Telegram'dan gelen kod">
<input id="pw" type="password" placeholder="İki adımlı şifre varsa (yoksa boş bırak)">
<button onclick="signIn()">Giriş yap</button></div></div>

<div class="card hide" id="s-ready"><h2>3. Kanallar</h2>
<p>Giriş yapılan hesap: <b id="me"></b> <button class="sec" onclick="logout()">Çıkış</button></p>
<textarea id="links" placeholder="Her satıra bir davet bağlantısı:&#10;https://t.me/+AbCdEf...&#10;https://t.me/kanaladim"></textarea>
<button id="go" onclick="scan()">Üyeleri çek</button>
<a id="dl" class="btn hide" href="/download">Excel'i indir</a>
<pre id="log" class="hide"></pre></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',body:JSON.stringify(b)});const j=await r.json();if(j.error){$('msg').textContent=j.error;throw j.error}$('msg').textContent='';return j}
async function refresh(){const s=await api('/api/state');
 for(const k of['config','login','ready'])$('s-'+k).classList.toggle('hide',s.step!==k);
 if(s.me)$('me').textContent=s.me}
async function saveCfg(){await api('/api/config',{api_id:$('api_id').value,api_hash:$('api_hash').value});refresh()}
async function sendCode(){await api('/api/send_code',{phone:$('phone').value});$('codebox').classList.remove('hide')}
async function signIn(){await api('/api/sign_in',{code:$('code').value,password:$('pw').value});refresh()}
async function logout(){await api('/api/logout',{});refresh()}
async function scan(){await api('/api/scan',{links:$('links').value});$('log').classList.remove('hide');$('dl').classList.add('hide');$('go').disabled=true;poll()}
async function poll(){const s=await api('/api/status');$('log').textContent=s.log.join('\n');
 if(s.running){setTimeout(poll,1000)}else{$('go').disabled=false;if(Object.keys(s.counts).length)$('dl').classList.remove('hide')}}
refresh();
</script></body></html>
