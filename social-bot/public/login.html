<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giriş · Social Bot</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#f4f4f5;background:radial-gradient(900px 500px at 20% 0%,#312e81 0%,transparent 60%),radial-gradient(800px 500px at 100% 100%,#831843 0%,transparent 55%),#0b0b10}
.card{width:min(380px,92vw);padding:36px 28px;border-radius:20px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
.logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#6366f1,#ec4899)}
h1{margin:0 0 4px;font-size:24px}p{margin:0 0 22px;color:#a1a1aa;font-size:14px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#fff;font:inherit;outline:none}
input:focus{border-color:#818cf8}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#6366f1,#ec4899)}
button:disabled{opacity:.6}#e{min-height:20px;margin-top:12px;color:#fca5a5;font-size:14px}
</style></head><body>
<form class="card" id="f">
  <div class="logo">▶</div>
  <h1>Social Bot</h1><p>Instagram · YouTube · TikTok otomatik paylaşım</p>
  <input id="p" type="password" placeholder="Şifre" autocomplete="current-password" autofocus required>
  <button id="b">Giriş yap</button><div id="e"></div>
</form>
<script>
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;E('');
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});
  if(r.ok)location.href='/';else{E((await r.json()).error);b.disabled=false;p.select()}};
function E(t){document.getElementById('e').textContent=t}
</script></body></html>
